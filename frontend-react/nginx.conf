server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  # API calls go to the Spring Boot container (same origin, so no CORS needed)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # nginx's own error when the backend container is not listening yet
    error_page 502 504 = @backend_starting;
  }

  location @backend_starting {
    default_type application/json;
    return 503 '{"status":503,"message":"The backend is still starting. Try again in a few seconds."}';
  }

  # Hashed build assets can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every other path serves index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
