name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-springboot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test and package
        run: mvn -B -ntp package
      - name: Smoke test the REST API (no Camunda connection)
        env:
          CAMUNDA_CLUSTER_ID: smoke-test
          CAMUNDA_CLIENT_ID: smoke-test
          CAMUNDA_CLIENT_SECRET: smoke-test
          DEPLOY_ON_STARTUP: "false"
        run: |
          java -jar target/condonation-backend.jar > /tmp/app.log 2>&1 &
          ../.github/scripts/smoke-test.sh
      - name: Backend log
        if: always()
        working-directory: .
        run: grep -v "io.camunda.client.impl\|io.camunda.client.job" /tmp/app.log | tail -80 || true

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build
        run: npm run build
      - name: Lockfile (printed when the repo has none yet)
        run: |
          if ! git ls-files --error-unmatch package-lock.json > /dev/null 2>&1; then
            echo "LOCKFILE-BEGIN"
            gzip -9c package-lock.json | base64 -w0
            echo
            echo "LOCKFILE-END"
          fi
