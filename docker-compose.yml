# Runs the whole application:  docker compose up --build
#   website  -> http://localhost:3000   (nginx serving React, forwarding /api to the backend)
#   backend  -> http://localhost:8080   (Spring Boot + Camunda job workers + H2)
# Secrets and settings come from .env (copy .env.example to .env and fill it in).
# Camunda itself runs in Camunda 8 SaaS, so it is not a container here.

name: condonation

services:
  backend:
    build:
      context: .
      dockerfile: backend-springboot/Dockerfile
    env_file: .env
    environment:
      DB_URL: jdbc:h2:file:/app/data/condonation
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend-react
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  backend-data:
